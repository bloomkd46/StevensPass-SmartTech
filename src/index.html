<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <!-- Apple App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- Addresses Deprecation Logged In Edge Dev Console-->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" href="./icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./icons/site.webmanifest" />
    <!-- Theme colors -->
    <meta name="theme-color" content="rgb(233, 236, 239)" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="rgb(52, 58, 64)" media="(prefers-color-scheme: dark)">
    <script>
      function setTheme() {
        document.documentElement.setAttribute("data-bs-theme", window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
      setTheme();
      window.matchMedia('(prefers-color-scheme: dark)').onchange = setTheme;
    </script>
  </head>
  <body class="bg-body">
    <app-root></app-root>
  </body>
</html>
